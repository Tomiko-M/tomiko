name: Release

# Publishes the version in package.json to npm through trusted publishing (no npm token is
# stored), then creates its GitHub release. Any of these starts it:
#
# - pushing a version tag: `npm version patch|minor|major`, then `git push --follow-tags`;
#   the release notes are the tag's message
# - publishing a release in GitHub's UI with a new `vX.Y.Z` tag
# - running this workflow by hand on main (Actions → Release → Run workflow): it creates the tag
#   and the release itself, with the notes you give or notes generated from merged pull requests
#
# One-time setup, after the first `npm publish` by hand: on npmjs.com open the package →
# Settings → Trusted Publisher → GitHub Actions: owner Tomiko-M, repository tomiko, workflow
# release.yml, with "Allow npm publish" checked.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes in Markdown. Leave empty to generate them from merged pull requests.
        required: false
        default: ""
      check_only:
        description: Only check that npm accepts this workflow as a trusted publisher; publish nothing.
        type: boolean
        default: false

# A release made in the UI also pushes its tag; runs queue up instead of publishing twice.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create the tag and the GitHub release
  id-token: write # lets npm verify this workflow and sign provenance

jobs:
  # What GitHub tells npm about this run, and what npm answers. Prints no token.
  check:
    if: inputs.check_only
    runs-on: ubuntu-latest
    steps:
      - name: Ask npm for a publish token
        run: |
          id_token="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)"
          echo "GitHub presents this run as:"
          python3 - "$id_token" <<'PY'
          import base64, json, sys
          payload = sys.argv[1].split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          keys = ["repository", "repository_owner", "workflow_ref", "job_workflow_ref", "event_name", "ref", "environment"]
          print(json.dumps({k: claims.get(k) for k in keys}, indent=2))
          PY
          status="$(curl -sS -o answer.json -w '%{http_code}' -X POST -H "Authorization: Bearer $id_token" \
            https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/tomiko)"
          echo "npm answered HTTP $status:"
          jq 'del(.token)' answer.json || cat answer.json

  publish:
    if: ${{ !inputs.check_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Update npm (trusted publishing needs 11.5.1 or newer)
        run: npm install -g npm@latest
      - run: npm ci
      - name: Work out the tag
        id: version
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            existing="$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)"
            if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $tag already exists on another commit ($existing)"
              exit 1
            fi
          elif [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # Re-running a release, or tagging a version that was published by hand, is not an error.
      - name: Skip versions already on npm
        id: published
        run: |
          spec="$(node -p 'const p = require("./package.json"); `${p.name}@${p.version}`')"
          if npm view "$spec" version > /dev/null 2>&1; then
            echo "::notice::$spec is already on npm; nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # prepublishOnly runs the typecheck, tests, build and smoke test before anything is uploaded.
      # Pre-releases (1.2.0-beta.1) go to the `next` tag so `npm install tomiko` keeps the stable one.
      - name: Publish to npm
        if: steps.published.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          # npm only signs provenance for public repositories and refuses to publish otherwise.
          NPM_CONFIG_PROVENANCE: ${{ !github.event.repository.private }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::Release $TAG already exists"
            exit 0
          fi
          flags=(--title "$TAG")
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            flags+=(--target "$GITHUB_SHA")
            if [ -n "$NOTES" ]; then flags+=(--notes "$NOTES"); else flags+=(--generate-notes); fi
          else
            flags+=(--verify-tag --notes-from-tag)
          fi
          gh release create "$TAG" "${flags[@]}"
